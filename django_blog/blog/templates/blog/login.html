{% extends 'blog/base.html' %}

{% block content %}
<div class="form-container">
    <h2>Login</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Login</button>
    </form>
    <div class="form-footer">
        <small>Need an account? <a href="{% url 'register' %}">Register Now</a></small>
    </div>
</div>
{% endblock %}
